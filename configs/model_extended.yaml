# Extended leakage-safe sweep. Caps are documented and smaller than production
# (300k/120k) so the run finishes; do not replace production unless gene-disjoint
# macro AUPRC honestly improves.
seed: 62
dataset: research/data/processed/training_dataset.parquet
train_sample_cap: 80000
eval_sample_cap: 30000
splits: [gene_disjoint]
models: [logreg, random_forest, xgboost, lightgbm, mlp]
imbalance:
  strategy: class_weight
calibration:
  method: temperature
  binary_method: isotonic
selection_policy:
  primary: macro_auprc_ovr
  secondary: [mcc, macro_auroc_ovr]
  safety: ece
  headline_split: gene_disjoint
xgboost: {n_estimators: 150, max_depth: 6, learning_rate: 0.1, tree_method: hist}
lightgbm: {n_estimators: 150, num_leaves: 31, learning_rate: 0.1}
random_forest: {n_estimators: 120, max_depth: 12}
mlp: {hidden: [64, 32], max_iter: 25}
logreg: {max_iter: 1500, C: 1.0}
